<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 2-Form</title>
</head>
<body>
    <form action="" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br>
        <label for="number">Number:</label><br>
        <input type="number" id="number" name="number"><br>
        <label for="tel">Tel:</label><br>
        <input type="tel" id="tel" name="tel"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br>
        <label for="birthday">Birthday:</label><br>
        <input type="date" id="birthday" name="birthday"><br>
        <input type="radio" id="html" name="fav_language" value="html">
        <label for="html">HTML</label><br>
        <input type="radio" id="css" name="fav_language" value="css">
        <label for="css">CSS</label><br>
        <input type="radio" id="javascript" name="fav_language" value="javascript">
        <label for="javascript">JavaScript</label><br>


        <input type="checkbox" id="vehicle1" name="vehicle" value="Bike">
        <label for="vehicle1">I have a bike</label><br>
        <input type="checkbox" id="vehicle2" name="vehicle" value="Car">
        <label for="vehicle2">I have a car</label><br>
        <input type="checkbox" id="vehicle3" name="vehicle" value="Boat">
        <label for="vehicle3">I have a boat</label><br>

        <label for="favcolor">Select your favorite color:</label>
        <input type="color" id="favcolor" name="favcolor"> <br>
        <textarea name="textarea" rows="10" cols="30" placeholder="Enter text here..."></textarea><br>
        <input type="button" value="button" id="button" name="button">
        <input type="submit" value="Submit" id="submit" name="submit">
        <input type="reset" value="Reset" id="reset" name="reset">
    </form>
</body>
</html>
