<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 4-Mouse Event</title>
</head>
<body>
    <img name="img1" alt="" onmouseover="gantiGambar1()" onmouseout="gantiGambar2()" width="200" height="200"
     src="https://media.istockphoto.com/id/1358773518/id/vektor/kacamata-meme-kehidupan-hitam-dalam-gaya-seni-piksel.jpg?s=612x612&w=0&k=20&c=dSI43x8-R2ugsDIw25m7UEW6V3USlYIsGNshGy49GOg=">
    <script>
        function gantiGambar1(){
            document.img1.src="https://i.pinimg.com/236x/5f/ed/96/5fed96e2b9517b38f447c4df5a44af6d.jpg"
        }
        function gantiGambar2(){
            document.img1.src="https://ih1.redbubble.net/image.4112619326.2548/st,small,507x507-pad,600x600,f8f8f8.u1.webp"
        }
    </script>
</body>
</html>
