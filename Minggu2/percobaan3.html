<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 3-Table</title>
</head>
<style>
    table, td, th{
        border: 1px solid black;
    }
</style>

<body>    
<p>Tabel Biasa</p>
<table>
    <tr>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Age</th>
    </tr>
    <tr>
        <td>Elon</td>
        <td>Musk</td>
        <td>51</td>
    </tr>
    <tr>
        <td>Bill</td>
        <td>Gates</td>
        <td>67</td>
    </tr>
</table>
<p>Colspan</p>
<table>
    <tr>
        <th colspan="2">Name</th>
        <th colspan="2">Age</th>
    </tr>
    <tr>
        <td>Elon</td>
        <td>Musk</td>
        <td>51</td>
    </tr>
    <tr>
        <td>Bill</td>
        <td>Gates</td>
        <td>67</td>
    </tr>
</table>

</body>

</html>
