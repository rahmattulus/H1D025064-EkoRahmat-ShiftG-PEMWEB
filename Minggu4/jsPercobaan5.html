<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 4-Validasi Form</title>
</head>
<body>
    <form method="post" name="frmbuku" onsubmit="return cek()">
        <table>
            <tr>
                <td>Nama</td>
                <td><input type="text" name="nama" id="fieldnama"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Kirim"></td>
            </tr>
        </table>
    </form>
    <script>
        function cek(){
            const fieldnama= document.getElementById("fieldnama");
            if (fieldnama.value == "") {
                alert("Nama harus diisi!!");
                fieldnama.focus();
                return false;
            }
            alert("Pengisian form sukses");
            return true;
        }
    </script>
</body>
</html>
