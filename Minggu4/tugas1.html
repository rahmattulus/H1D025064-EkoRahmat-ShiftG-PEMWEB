<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 - JS</title>
</head>

<body>
    <h2>Cek Ketegori Nilai</h2>
    <form method="post" onsubmit="return kategori()">
        <label for="nilai">Nilai : </label>
        <input type="number" name="nilai" id="nilai" required>
        <br>
        <input type="submit" value="Cek">
    </form>
    <h3 id="hasil"></h3>
    <script>
        function kategori() {
            const nilai = document.getElementById("nilai").value
            const hasil = document.getElementById("hasil")
            let predikat = ""

            if (nilai > 100 || nilai < 0) {
                predikat = "Nilai tidak sesuai standar (0 - 100)";
            } else if (nilai >= 81) {
                predikat = "Kategori: A";
            } else if (nilai >= 61) {
                predikat = "Kategori: B";
            } else if (nilai >= 41) {
                predikat = "Kategori: C";
            } else if (nilai >= 21) {
                predikat = "Kategori: D";
            } else {
                predikat = "Kategori: E";
            }
            hasil.innerText = predikat
            return false
        }
    </script>
</body>
</html>
